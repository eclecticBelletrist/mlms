[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlms"
version = "0.1.0"
description = "Multi-Layer Memory System — MCP server for persistent LLM agent memory"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "eclecticBelletrist" }]
keywords = ["mcp", "llm", "agent-memory", "pgvector", "timescaledb", "coala"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "uvicorn[standard]>=0.30",
    "mcp>=1.30.0,<2",  # CVE-2025-66416 (DNS rebinding) + CVE-2026-52869 (session_id hijack on stateful sse/streamable-http) fixes
    "psycopg[binary]>=3.1",  # binary: bundled libpq, no system libpq required
    "psycopg_pool>=3.3.3",
    "redis>=8.1.0",
    "alembic>=1.20.0",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "mypy>=2.4.0",
    "ruff>=0.17.1",
    "rank-bm25>=0.2",
]

# ─── Ruff ────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ASYNC", # flake8-async (catches sync calls in async functions)
]
ignore = [
    "E501",  # line length — handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["mlms"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Mypy ────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_errors = true

# ─── Pytest ──────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "-v",
]
# signal method: SIGALRM does interrupt threading.Thread.join()'s underlying
# lock.acquire(timeout=...) — confirmed live. anyio's blocking-portal thread is
# daemon=True, so an orphaned hung thread from a failed test doesn't block process
# exit either. thread method would instead os._exit() the whole run on one hung
# test — worse. See KEY_DECISIONS.md Decision 27 for the hang this guards against
# (test_legitimate_loopback_origin_is_not_rejected used to hang the suite forever).
timeout = 30
timeout_method = "signal"
markers = [
    "unit: fast, no DB/Redis required",
    "integration: requires docker compose up",
    "benchmark: latency and precision measurements",
]

[tool.coverage.run]
source = ["src/mlms"]
omit = ["tests/*", "alembic/*", "scripts/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

# ─── Hatch ───────────────────────────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
packages = ["src/mlms"]