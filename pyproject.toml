[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlms"
version = "0.1.0"
description = "Multi-Layer Memory System — MCP server for persistent LLM agent memory"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "mcp>=1.0",
    "asyncpg>=0.29",
    "psycopg[async]>=3.1",
    "pgvector>=0.3",
    "redis[asyncio]>=5.0",
    "alembic>=1.13",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/mlms"]
