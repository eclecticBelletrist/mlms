version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Version updates are off; security updates have their own limit and still open.
    open-pull-requests-limit: 0
    ignore:
      # Capped below 2 until the code moves to MCPServer (Decisions 4 and 20).
      - dependency-name: mcp
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The image stays on the Python version CI runs (3.11).
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A major Postgres or Redis upgrade needs a data migration, not a tag bump.
      - dependency-name: "*"
        update-types: [version-update:semver-major]
