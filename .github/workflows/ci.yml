name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Images and credentials mirror docker-compose.yml — keep the two in sync.
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_DB: mlms
          POSTGRES_USER: mlms
          POSTGRES_PASSWORD: mlms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mlms -d mlms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.11"

      # --locked fails the build if uv.lock is out of sync with pyproject.toml
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src

      - name: docs consistency
        run: uv run python scripts/check_docs.py

      - name: alembic upgrade head
        run: uv run alembic upgrade head

      - name: pytest (unit)
        run: uv run pytest -m unit --cov=src/mlms --cov-report=term-missing

      - name: pytest (integration)
        run: uv run pytest -m integration
        env:
          MLMS_INTEGRATION: "1"
