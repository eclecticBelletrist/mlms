name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.11"

      # --locked fails the build if uv.lock is out of sync with pyproject.toml
      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy src

      # integration/ requires `docker compose up` (Postgres pgvector+TimescaleDB, Redis) —
      # not covered by default GitHub Actions `services:` without a custom image, so it's
      # excluded here and run manually instead. See docs/known-issues.md.
      - name: pytest (unit)
        run: uv run pytest -m "not integration" --cov=src/mlms --cov-report=term-missing
