services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mlms}
      POSTGRES_USER: ${POSTGRES_USER:-mlms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlms}
    volumes:
      - postgres_data:/home/postgres/pgdata/data
    ports:
      - "5432:5432"
    healthcheck:
      # $$ (not ${...}) reads the container's own POSTGRES_USER/POSTGRES_DB set above —
      # a second inline default here would duplicate the "mlms" fallback in two places.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mlms:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Service names, not localhost — this container talks to the other two over
      # the compose network, unlike the host-run defaults in .env.example.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mlms}:${POSTGRES_PASSWORD:-mlms}@postgres:5432/${POSTGRES_DB:-mlms}
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-https://openrouter.ai/api/v1}
      # stdio can't serve a detached compose service (no attached stdin) — HTTP-based
      # transport is required here, see KEY_DECISIONS.md Decision 20.
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      # 0.0.0.0 above is a non-loopback bind — the server refuses to start without this
      # (Decision 23). No default here on purpose: unlike POSTGRES_PASSWORD above, there
      # is no safe fallback value for an auth secret.
      MCP_SHARED_SECRET: ${MCP_SHARED_SECRET:?set MCP_SHARED_SECRET in .env — see README}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
