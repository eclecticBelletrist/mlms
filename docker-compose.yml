services:
  postgres:
    image: timescale/timescaledb-ha:pg16.15-ts2.30.2
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mlms}
      POSTGRES_USER: ${POSTGRES_USER:-mlms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlms}
    volumes:
      - postgres_data:/home/postgres/pgdata/data
    ports:
      # Loopback only: the default password is mlms and Docker's published ports bypass
      # ufw, so "5432:5432" would expose the database to the whole network on a VPS.
      - "127.0.0.1:5432:5432"
    healthcheck:
      # $$ (not ${...}) reads the container's own POSTGRES_USER/POSTGRES_DB set above —
      # a second inline default here would duplicate the "mlms" fallback in two places.
      # -h 127.0.0.1: on a new volume the image first starts a temporary server that listens
      # only on the unix socket, then restarts; without -h the check passes against that one.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.10.2-alpine
    volumes:
      - redis_data:/data
    ports:
      # Loopback only, for the same reason as postgres; redis has no password.
      - "127.0.0.1:6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mlms:
    build: .
    # Not started by a plain `docker compose up`: the stdio setup in the README needs only
    # postgres and redis. Start it with `docker compose --profile app up -d --build`.
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Service names, not localhost — this container talks to the other two over
      # the compose network, unlike the host-run defaults in .env.example.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mlms}:${POSTGRES_PASSWORD:-mlms}@postgres:5432/${POSTGRES_DB:-mlms}
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-https://openrouter.ai/api/v1}
      # stdio can't serve a detached compose service (no attached stdin) — HTTP-based
      # transport is required here, see KEY_DECISIONS.md Decision 20.
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      # 0.0.0.0 above is a non-loopback bind — the server refuses to start without this
      # (Decision 23) and says so in its log. Empty default on purpose: unlike
      # POSTGRES_PASSWORD above there is no safe fallback value for an auth secret, and
      # a required `${...:?}` here would also block `docker compose up` for postgres and
      # redis alone, because Compose substitutes variables before it applies profiles.
      MCP_SHARED_SECRET: ${MCP_SHARED_SECRET:-}
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
